services:
  - type: web
    name: travel-footprint
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: APP_UPLOAD_DIR
        value: /tmp/uploads
      - key: APP_UPLOAD_STORAGE_MODE
        value: database
      - key: APP_ANDROID_APK_PATH
        value: /app/downloads/travel-footprint-android.apk
      - key: H2_CONSOLE_ENABLED
        value: "false"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError
      - key: APP_DEMO_SEED_ENABLED
        value: "false"
      - key: APP_ADMIN_BOOTSTRAP_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        sync: false
