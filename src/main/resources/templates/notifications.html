<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('通知中心 | 旅迹')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<section th:replace="~{fragments :: flash}"></section>

<main class="container page-shell">
    <section class="section-heading">
        <div>
            <span class="eyebrow">通知中心</span>
            <h1>最近互动提醒</h1>
            <p>这里集中显示点赞、评论、关注等与你有关的动态。</p>
        </div>
        <form th:if="${unreadCount > 0}" th:action="@{/notifications/read-all}" method="post">
            <button class="secondary-button" type="submit" th:text="|全部标为已读（${unreadCount}）|">全部标为已读</button>
        </form>
    </section>

    <div class="empty-state" th:if="${#lists.isEmpty(notifications)}">
        目前还没有新的通知，去发布内容或和别人互动一下吧。
    </div>

    <div class="notification-list" th:if="${!#lists.isEmpty(notifications)}">
        <a class="notification-card" th:classappend="${item.readAt == null ? ' unread' : ''}"
           th:each="item : ${notifications}" th:href="@{/notifications/{id}/open(id=${item.id})}">
            <div>
                <strong th:text="${item.message}">通知文案</strong>
                <p><span th:text="${item.type.label}">类型</span><i th:if="${item.readAt == null}">未读</i></p>
            </div>
            <span th:text="${#temporals.format(item.createdAt, 'yyyy-MM-dd HH:mm')}">时间</span>
        </a>
    </div>
</main>
</body>
</html>
