<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#d4662a">
    <title>离线状态 | 旅迹</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="container page-shell">
    <section class="hero-panel offline-page-panel">
        <div class="hero-copy">
            <span class="eyebrow">离线模式</span>
            <h1>当前没有网络连接，但你仍然可以继续使用一部分功能。</h1>
            <p>如果你之前访问过首页、地图页或发帖页，系统会优先从本机缓存里打开这些页面。发帖草稿也会保存在本地，恢复联网后再继续提交即可。</p>
            <div class="hero-actions">
                <a class="primary-button" href="/">回到首页</a>
                <a class="secondary-button" href="/map">打开旅行地图</a>
                <a class="secondary-button" href="/posts/new">继续写足迹草稿</a>
            </div>
        </div>
        <div class="hero-card-grid">
            <article class="glass-card">
                <p class="card-label">可离线</p>
                <strong>已访问页面</strong>
            </article>
            <article class="glass-card">
                <p class="card-label">可离线</p>
                <strong>本地草稿</strong>
            </article>
            <article class="glass-card">
                <p class="card-label">需联网</p>
                <strong>最终提交</strong>
            </article>
            <article class="glass-card">
                <p class="card-label">需联网</p>
                <strong>最新同步</strong>
            </article>
        </div>
    </section>
</main>
</body>
</html>
