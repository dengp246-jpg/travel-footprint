spring.application.name=travel-footprint
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/travel-footprint;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=35MB
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
app.upload-dir=${APP_UPLOAD_DIR:uploads}
app.upload.storage-mode=${APP_UPLOAD_STORAGE_MODE:filesystem}
app.android-apk-path=${APP_ANDROID_APK_PATH:outputs/travel-footprint-android-debug.apk}
app.upload.max-image-size-bytes=${APP_UPLOAD_MAX_IMAGE_SIZE_BYTES:5242880}
app.upload.max-video-size-bytes=${APP_UPLOAD_MAX_VIDEO_SIZE_BYTES:20971520}
app.import.baidu-scenic-file=${APP_BAIDU_SCENIC_FILE:data/baidu-scenic-seeds.json}
app.security.login.max-attempts=${APP_LOGIN_MAX_ATTEMPTS:8}
app.security.login.window-minutes=${APP_LOGIN_WINDOW_MINUTES:15}
app.demo.seed-enabled=${APP_DEMO_SEED_ENABLED:true}
app.admin.bootstrap-password=${APP_ADMIN_BOOTSTRAP_PASSWORD:}
app.mini.session-validity-days=${APP_MINI_SESSION_VALIDITY_DAYS:30}
