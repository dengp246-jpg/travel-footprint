<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#176557">
    <title th:text="${title}">旅迹</title>
    <link rel="manifest" th:href="@{/manifest.webmanifest(v='20260808-2')}">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/app-icon.svg(v='20260809-1')}">
    <link rel="stylesheet" th:href="@{/css/style.css(v='20260817-2')}">
    <link rel="stylesheet" th:href="@{/css/premium.css(v='20260809-1')}">
    <script defer th:src="@{/js/app-shell.js(v='20260809-1')}"></script>
</head>
<body>
<header th:fragment="nav" class="site-header">
    <div class="container nav-shell">
        <a class="brand" th:href="@{/}">
            <span class="brand-emblem" aria-hidden="true">TF</span>
            <span class="brand-copy">
                <span class="brand-mark">旅迹</span>
                <span class="brand-subtitle">Travel Footprint</span>
            </span>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation"
                data-nav-toggle>
            <span aria-hidden="true">☰</span>
            <span>菜单</span>
        </button>
        <nav class="nav-links" id="primary-navigation" data-primary-navigation>
            <a th:href="@{/}">首页</a>
            <details class="nav-more" th:if="${currentUser != null}">
                <summary>记录</summary>
                <div>
                    <a th:href="@{/posts/new}">发布足迹</a>
                    <a th:href="@{/map(mode='personal',sort='oldest')}">时空故事</a>
                    <a th:href="@{/passport}">旅行护照</a>
                    <a th:href="@{/reports}">旅行报告</a>
                    <a th:href="@{/recap}">年度回顾</a>
                    <a th:href="@{/calendar}">旅行日历</a>
                </div>
            </details>
            <details class="nav-more" th:if="${currentUser != null}">
                <summary>计划</summary>
                <div>
                    <a th:href="@{/plans}">行程计划</a>
                    <a th:href="@{/wishlist}">想去清单</a>
                    <a th:href="@{/expenses}">旅行账本</a>
                    <a th:href="@{/goals}">旅行目标</a>
                </div>
            </details>
            <details class="nav-more" th:if="${currentUser != null}">
                <summary>探索</summary>
                <div>
                    <a th:href="@{/map}">足迹地图</a>
                    <a th:href="@{/search}">全局搜索</a>
                    <a th:href="@{/guides}">目的地攻略</a>
                    <a th:href="@{/recommendations}">为你推荐</a>
                    <a th:href="@{/insights}">高级洞察</a>
                    <a th:href="@{/discover}">旅行同好</a>
                </div>
            </details>
            <details class="nav-more" th:if="${currentUser != null}">
                <summary>我的</summary>
                <div>
                    <a th:href="@{/me}">个人主页</a>
                    <a th:href="@{/favorites}">我的收藏</a>
                    <a th:href="@{/messages}">私信 <span class="badge" th:if="${unreadMessageCount > 0}" th:text="${unreadMessageCount}">0</span></a>
                    <a th:href="@{/notifications}">通知 <span class="badge" th:if="${unreadNotificationCount > 0}" th:text="${unreadNotificationCount}">0</span></a>
                    <a th:href="@{/settings}">资料与数据</a>
                    <a th:if="${currentUser.admin}" th:href="@{/admin}">审核台</a>
                </div>
            </details>
            <a th:if="${currentUser != null}" th:href="@{/me}" class="nav-user">
                <img th:if="${currentUser.avatarPath != null}" th:src="@{${currentUser.avatarPath}}" alt="avatar">
                <span th:if="${currentUser.avatarPath == null}" class="avatar-fallback"
                      th:text="${#strings.substring(currentUser.nickname, 0, 1)}">旅</span>
                <span th:text="${currentUser.nickname}">我的主页</span>
            </a>
            <a th:if="${currentUser == null}" th:href="@{/map}">地图</a>
            <a th:if="${currentUser == null}" th:href="@{/search}">搜索</a>
            <a th:if="${currentUser == null}" th:href="@{/login}">登录</a>
            <a th:if="${currentUser == null}" th:href="@{/register}" class="nav-accent">注册</a>
            <form th:if="${currentUser != null}" th:action="@{/logout}" method="post">
                <button class="text-button" type="submit">退出</button>
            </form>
        </nav>
    </div>
</header>

<section th:fragment="flash" class="container flash-stack">
    <div class="flash flash-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="flash flash-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
</section>
</body>
</html>
