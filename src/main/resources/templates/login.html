<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('登录 | 旅迹')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<section th:replace="~{fragments :: flash}"></section>

<main class="container auth-layout">
    <section class="auth-panel">
        <div>
            <span class="eyebrow">欢迎回来</span>
            <h1>登录旅迹，继续记录你的下一段旅行。</h1>
            <p th:if="${demoSeedEnabled}">演示账号可直接体验：`lin / 123456`、`yue / 123456`、`qing / 123456`。</p>
            <p th:unless="${demoSeedEnabled}">请使用已迁移的账号登录，或先注册一个新账号。</p>
        </div>
        <form class="auth-form" th:action="@{/login}" method="post">
            <label>
                用户名
                <input type="text" name="username" maxlength="50" autocomplete="username"
                       placeholder="请输入用户名" required>
            </label>
            <label>
                密码
                <input type="password" name="password" maxlength="72" autocomplete="current-password"
                       placeholder="请输入密码" required>
            </label>
            <button class="primary-button full-width" type="submit">登录</button>
        </form>
        <p class="auth-switch">还没有账号？<a th:href="@{/register}">去注册</a></p>
    </section>
</main>
</body>
</html>
