<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('为你推荐 | 旅迹')}"></head>
<body class="recommendation-page"><header th:replace="~{fragments :: nav}"></header><section th:replace="~{fragments :: flash}"></section>
<main class="container recommendation-shell">
    <section class="recommendation-hero"><div><span class="eyebrow">PERSONAL TRAVEL SIGNALS</span><h1><span th:text="${currentUser.nickname}">旅行者</span>，这些灵感可能适合你</h1><p>推荐只在本机服务器中计算，使用你的足迹主题、省份偏好和收藏；不会读取私信、密码或未参与的行程。</p></div><a class="secondary-button" th:href="@{/insights}">查看我的旅行画像</a></section>
    <section class="preference-panel"><div><span>偏好主题</span><div class="preference-chips"><i th:each="item : ${recommendationView.categories}" th:text="${item.label}">自然风光</i><i th:if="${#lists.isEmpty(recommendationView.categories)}">等待更多记录</i></div></div><div><span>关注地区</span><div class="preference-chips"><i th:each="item : ${recommendationView.provinces}" th:text="${item.label}">浙江</i><i th:if="${#lists.isEmpty(recommendationView.provinces)}">全国探索</i></div></div><small th:text="${recommendationView.coldStart ? '目前使用近期公开内容进行冷启动推荐，记录或收藏后会逐渐个性化。' : '推荐理由来自你的内容特征；不感兴趣的内容可以移除，之后不会再次出现。'}">说明</small></section>
    <section class="recommendation-heading"><div><span class="eyebrow">FOR YOU</span><h2>个性化旅行灵感</h2></div><div class="recommendation-reset"><span th:text="|已减少 ${recommendationView.dismissedCount} 条不感兴趣内容|">0</span><form th:if="${recommendationView.dismissedCount > 0}" th:action="@{/recommendations/reset}" method="post"><button type="submit">恢复全部</button></form></div></section>
    <div class="recommendation-grid"><article th:each="item : ${recommendationView.recommendations}"><a class="recommendation-cover" th:href="@{/posts/{id}(id=${item.post.id})}" th:classappend="${item.post.photoPath == null ? ' no-image' : ''}" th:style="${item.post.photoPath != null ? 'background-image:url(' + item.post.photoPath + ')' : ''}"><span th:text="|匹配度 ${item.score}|">匹配度</span></a><div><small th:text="|${item.post.province == null ? '旅行目的地' : item.post.province} · ${item.post.category == null ? '旅行灵感' : item.post.category}|">主题</small><h3><a th:href="@{/posts/{id}(id=${item.post.id})}" th:text="${item.post.title}">标题</a></h3><p th:text="${item.reason}">推荐理由</p><div><a th:href="@{/posts/{id}(id=${item.post.id})}">查看详情</a><form th:action="@{/recommendations/{id}/dismiss(id=${item.post.id})}" method="post"><button type="submit">减少此类推荐</button></form></div></div></article><div class="empty-state" th:if="${#lists.isEmpty(recommendationView.recommendations)}">暂时没有新的推荐。可以前往<a th:href="@{/guides}">目的地攻略</a>主动探索。</div></div>
</main></body></html>
